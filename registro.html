<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Bellísima Manor</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="contenedor-formulario">
        <h2>Crear Nuevo usuario</h2>
        <form id="form-registro">
            <div class="grupo-input">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ej. juan pablo">
            </div>

            <div class="grupo-input">
                <label for="email">Correo electronico</label>
                <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">
            </div>

            <div class="grupo-input">
                <label for="password">contraseña</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-registrar">Registrar usuario</button>
        </form>
    </div>

    <script>
        document.getElementById('form-registro').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            
            const nuevoUsuario = { nombre: nombre, email: email };
            
            alert(`¡Registro exitoso, ${nombre}!`);
            window.location.href = 'pagina web.html';

            localStorage.setItem('usuarioRegistrado', JSON.stringify(nuevoUsuario));
        
        alert(`¡Registro exitoso, ${nombre}!`);
        window.location.href = 'index.html';
    });
    </script>
</body>
